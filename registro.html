<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


        <label for="profesion">Profesión
            <select id="profesion" name="profesion" required>
                <option value="" disabled selected>Elegí una opción</option>
                <option value="Electricista">Electricista</option>
                <option value="Plomero">Plomero</option>
                <option value="Gasista">Gasista</option>
                <option value="Carpintero">Carpintero</option>
                <option value="Pintor">Pintor</option>
                <option value="Albañil">Albañil</option>
                <option value="Jardinero">Jardinero</option>
                <option value="Técnico de aires acondicionados">Técnico de aires acondicionados</option>
                <option value="Cerrajero">Cerrajero</option>
                <option value="Otra">Otra</option>
            </select>
        </label>

        <div class="fila">
            <label for="fecha_alta">Fecha de alta
                <span class="ayuda">Cuándo empezaste a ejercer.</span>
                <input type="date" id="fecha_alta" name="fecha_alta" required>
            </label>
            <label for="fecha_baja">Fecha de baja (opcional)
                <span class="ayuda">Dejala vacía si seguís en actividad.</span>
                <input type="date" id="fecha_baja" name="fecha_baja">
            </label>
        </div>

        <label for="descripcion">Descripción de tus servicios
            <span class="ayuda">Qué trabajos hacés y qué te diferencia.</span>
            <textarea id="descripcion" name="descripcion" maxlength="300" required></textarea>
            <span class="contador" id="contador" aria-live="off">0 / 300</span>
        </label>

        <div class="fila">
            <label for="ciudad">Ciudad
                <input type="text" id="ciudad" name="ciudad" autocomplete="address-level2" required>
            </label>
            <label for="experiencia">Años de experiencia
                <input type="number" id="experiencia" name="experiencia" min="0" max="60" inputmode="numeric" required>
            </label>
        </div>

        <label for="telefono">Teléfono de contacto
            <input type="tel" id="telefono" name="telefono" autocomplete="tel" required>
        </label>

        <button type="submit">Guardar perfil</button>
        <p class="estado" id="estado" role="status"></p>
    </form>
    
</body>
</html>
